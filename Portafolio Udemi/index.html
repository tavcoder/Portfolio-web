<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Portfolio de Tania Arteaga - Frontend Developer especializada en JavaScript y desarrollo web moderno">
    <meta name="keywords" content="frontend, developer, javascript, web development, portfolio, Tania Arteaga">
    <meta name="author" content="Tania Arteaga">

    <title>Tania Arteaga - Web Developer</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link id="theme-stylesheet" rel="stylesheet" href="assets/css/theme.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">

    <!-- Iconify -->
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</head>

<body>
    <div class="layout">
        <!-- Sidebar (info del usuario) -->
        <aside class="layout__aside">
            <!-- User Info Section -->
            <section class="aside__user-info">
                <!-- Información general usuario -->
                <div class="user-info__general">
                    <div class="user-info__container-image">
                        <a href="index.html">
                            <img class="user-info__image" src="assets/img/imgPlaceholder.jpg?text= TA"
                                alt="Tania Arteaga Profile Picture">
                        </a>
                    </div>
                    <p class="user-info__name">Tania Arteaga</p>
                    <p class="user-info__title">Front End Developer</p>
                    <p class="user-info__email">tarteagadesign@gmail.com</p>
                    <div class="user-info__links" aria-label="Redes sociales">
                        <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer"
                            aria-label="LinkedIn Profile">
                            <i class="fab fa-linkedin"></i>
                        </a>
                        <a href="https://github.com/" target="_blank" rel="noopener noreferrer"
                            aria-label="GitHub Profile">
                            <i class="fab fa-github"></i>
                        </a>
                    </div>

                </div>

                <!-- Menú de navegación -->
                <nav class="aside__menu">
                    <ul class="menu__list">
                        <li class="menu__option">
                            <a class="btn btn--tertiary active" data-route="" href="#" aria-label="Inicio">Inicio</a>
                        </li>
                        <li class="menu__option">
                            <a class="btn btn--tertiary" data-route="skills" href="#skills" aria-label="Sobre mí">Sobre
                                mí</a>
                        </li>
                        <li class="menu__option">
                            <a class="btn btn--tertiary" data-route="projects" href="#projects"
                                aria-label="Proyectos">Proyectos</a>
                        </li>
                        <li class="menu__option">
                            <a class="btn btn--tertiary" data-route="studies" href="#studies"
                                aria-label="Estudios">Estudios</a>
                        </li>
                    </ul>
                </nav>
            </section>

            <!-- Language Toggle -->
            <div class="wrapper" role="button" aria-label="Cambiar idioma" tabindex="0">
                <svg viewBox="0 0 300 300" width="300" height="300" aria-hidden="true">
                    <defs>
                        <linearGradient id="degradadoHundoIntenso" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#e0e5ec" />
                            <stop offset="50%" stop-color="#e0e5ec" />
                            <stop offset="100%" stop-color="#e0e5ec" />
                        </linearGradient>

                        <filter id="inset-shadow-intenso" x="-50%" y="-50%" width="200%" height="200%">
                            <feOffset dx="0" dy="3" />
                            <feGaussianBlur stdDeviation="4" result="offset-blur" />
                            <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
                            <feFlood flood-color="black" flood-opacity="0.5" result="color" />
                            <feComposite operator="in" in="color" in2="inverse" result="shadow" />
                            <feComposite operator="over" in="shadow" in2="SourceGraphic" />
                        </filter>
                    </defs>

                    <path d="M 134 170 Q 125 195 95 202" fill="none" stroke="url(#degradadoHundoIntenso)"
                        stroke-width="10" stroke-linecap="round" filter="url(#inset-shadow-intenso)" />

                    <!-- Texto EN -->
                    <text x="136" y="150" font-size="10" font-weight="bold" fill="var(--color-text-button)"
                        text-anchor="middle">EN</text>

                    <!-- Texto ES -->
                    <text x="66" y="210" font-size="10" font-weight="bold" fill="var(--color-text-button)"
                        text-anchor="middle">ES</text>
                </svg>

                <div class="dot btn" role="switch" aria-checked="false" aria-label="Selector de idioma"></div>
            </div>
        </aside>

        <!-- Contenido principal -->
        <main class="layout__content">
            <div id="content__page" class="content__page neumorphic-scroll"></div>
        </main>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Tania Arteaga.</p>
    </footer>

    <!-- Application Entry Point -->
    <script type="module" src="js/main.js"></script>

    <!-- Theme Utility (standalone) -->
    <script src="js/utils/theme.js"></script>
</body>

</html>
